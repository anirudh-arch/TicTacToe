<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        /* === CSS Styling === */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        #statusText {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: bold;
            color: #555;
        }

        /* Container for board and line */
        .board-container {
            position: relative;
        }

        /* The Game Board Grid */
        #board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            background-color: #333; 
            padding: 5px;
            border-radius: 8px;
        }

        .cell {
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .cell:hover {
            background-color: #e9e9e9;
        }

        /* === The Winning Line CSS === */
        #win-line {
            position: absolute;
            background-color: #ff3366; 
            border-radius: 5px;
            display: none; 
            z-index: 10;
            pointer-events: none; 
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
        }

        .line-row-1 { top: 17%; left: 2%; width: 96%; height: 8px; display: block !important; }
        .line-row-2 { top: 50%; left: 2%; width: 96%; height: 8px; display: block !important; transform: translateY(-50%); }
        .line-row-3 { bottom: 17%; left: 2%; width: 96%; height: 8px; display: block !important; }
        
        .line-col-1 { left: 17%; top: 2%; height: 96%; width: 8px; display: block !important; }
        .line-col-2 { left: 50%; top: 2%; height: 96%; width: 8px; display: block !important; transform: translateX(-50%); }
        .line-col-3 { right: 17%; top: 2%; height: 96%; width: 8px; display: block !important; }
        
        .line-diag-1 { top: 50%; left: -10%; width: 120%; height: 8px; display: block !important; transform: translateY(-50%) rotate(45deg); }
        .line-diag-2 { top: 50%; left: -10%; width: 120%; height: 8px; display: block !important; transform: translateY(-50%) rotate(-45deg); }

        #endGameBtn {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 1.2rem;
            background-color: #dc3545; /* Red color for end game */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #endGameBtn:hover {
            background-color: #c82333;
        }

        /* === Final Score Screen CSS === */
        #finalScoreScreen {
            display: none; /* Hidden until the game ends */
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #finalScoreScreen h2 {
            margin-top: 0;
            color: #333;
            font-size: 2.5rem;
        }

        .score-tally {
            font-size: 1.8rem;
            margin: 15px 0;
            color: #555;
        }

        #overallWinnerMessage {
            margin-top: 30px;
            font-size: 2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Tic-Tac-Toe</h1>
    <div id="statusText">X's turn</div>

    <div class="board-container" id="gameArea">
        <div id="board">
            <div cellIndex="0" class="cell"></div>
            <div cellIndex="1" class="cell"></div>
            <div cellIndex="2" class="cell"></div>
            <div cellIndex="3" class="cell"></div>
            <div cellIndex="4" class="cell"></div>
            <div cellIndex="5" class="cell"></div>
            <div cellIndex="6" class="cell"></div>
            <div cellIndex="7" class="cell"></div>
            <div cellIndex="8" class="cell"></div>
        </div>
        <div id="win-line"></div>
    </div>

    <button id="endGameBtn">End Game</button>

    <div id="finalScoreScreen">
        <h2>Final Scores</h2>
        <div class="score-tally">Player X: <span id="scoreXDisplay" style="color: #007bff; font-weight: bold;">0</span></div>
        <div class="score-tally">Player O: <span id="scoreODisplay" style="color: #28a745; font-weight: bold;">0</span></div>
        <div id="overallWinnerMessage"></div>
    </div>

    <script>
        const cells = document.querySelectorAll('.cell');
        const statusText = document.querySelector('#statusText');
        const endGameBtn = document.querySelector('#endGameBtn');
        const winLine = document.getElementById('win-line');
        
        const gameArea = document.getElementById('gameArea');
        const finalScoreScreen = document.getElementById('finalScoreScreen');

        const winConditions = [
            { indexes: [0, 1, 2], lineClass: "line-row-1" },
            { indexes: [3, 4, 5], lineClass: "line-row-2" },
            { indexes: [6, 7, 8], lineClass: "line-row-3" },
            { indexes: [0, 3, 6], lineClass: "line-col-1" },
            { indexes: [1, 4, 7], lineClass: "line-col-2" },
            { indexes: [2, 5, 8], lineClass: "line-col-3" },
            { indexes: [0, 4, 8], lineClass: "line-diag-1" },
            { indexes: [2, 4, 6], lineClass: "line-diag-2" }
        ];

        let options = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let running = false;
        let gameHasEnded = false; 
        let restartTimer;

        let scoreX = 0;
        let scoreO = 0;

        initializeGame();

        function initializeGame() {
            cells.forEach(cell => cell.addEventListener('click', cellClicked));
            endGameBtn.addEventListener('click', finishGame);
            statusText.textContent = `${currentPlayer}'s turn`;
            running = true;
        }

        function cellClicked() {
            const cellIndex = this.getAttribute('cellIndex');

            if (options[cellIndex] != "" || !running || gameHasEnded) {
                return;
            }

            updateCell(this, cellIndex);
            checkWinner();
        }

        function updateCell(cell, index) {
            options[index] = currentPlayer;
            cell.textContent = currentPlayer;
            
            if (currentPlayer === "X") {
                cell.style.color = "#007bff"; 
            } else {
                cell.style.color = "#28a745";
            }
        }

        function changePlayer() {
            currentPlayer = (currentPlayer == "X") ? "O" : "X";
            statusText.textContent = `${currentPlayer}'s turn`;
        }

        function checkWinner() {
            let roundWon = false;
            let winningClass = "";

            for (let i = 0; i < winConditions.length; i++) {
                const condition = winConditions[i].indexes;
                const cellA = options[condition[0]];
                const cellB = options[condition[1]];
                const cellC = options[condition[2]];

                if (cellA == "" || cellB == "" || cellC == "") {
                    continue;
                }
                if (cellA == cellB && cellB == cellC) {
                    roundWon = true;
                    winningClass = winConditions[i].lineClass; 
                    break;
                }
            }

            if (roundWon) {
                statusText.textContent = `${currentPlayer} wins this round!`;
                winLine.className = winningClass; 
                running = false;
                
                if (currentPlayer === "X") {
                    scoreX++;
                } else {
                    scoreO++;
                }

                restartTimer = setTimeout(autoRestart, 1500);

            } else if (!options.includes("")) {
                statusText.textContent = `It's a Draw!`;
                running = false;
                
                restartTimer = setTimeout(autoRestart, 1500);
            } else {
                changePlayer();
            }
        }

        function autoRestart() {
            if (gameHasEnded) return; 

            currentPlayer = "X";
            options = ["", "", "", "", "", "", "", "", ""];
            statusText.textContent = `${currentPlayer}'s turn`;
            cells.forEach(cell => {
                cell.textContent = "";
                cell.style.color = "#333"; 
            });
            winLine.className = ""; 
            running = true;
        }

        function finishGame() {
            gameHasEnded = true;
            clearTimeout(restartTimer);

            gameArea.style.display = "none";
            statusText.style.display = "none";
            endGameBtn.style.display = "none";
            document.querySelector('h1').style.display = "none";

            document.getElementById('scoreXDisplay').textContent = scoreX;
            document.getElementById('scoreODisplay').textContent = scoreO;

            const winnerMessage = document.getElementById('overallWinnerMessage');
            if (scoreX > scoreO) {
                winnerMessage.textContent = "🏆 Player X is the Overall Winner! 🏆";
                winnerMessage.style.color = "#007bff";
            } else if (scoreO > scoreX) {
                winnerMessage.textContent = "🏆 Player O is the Overall Winner! 🏆";
                winnerMessage.style.color = "#28a745";
            } else {
                winnerMessage.textContent = "🤝 It's a Tie! 🤝";
                winnerMessage.style.color = "#333";
            }

            finalScoreScreen.style.display = "block";
        }
    </script>
</body>
</html>
